server {
    listen 80;
    listen [::]:80;
    server_name xn--portalverdadecear-npb.nabio.pro;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xn--portalverdadecear-npb.nabio.pro;

    ssl_certificate /etc/letsencrypt/live/xn--portalverdadecear-npb.nabio.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xn--portalverdadecear-npb.nabio.pro/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:PortalVerdadeCearaSSL:10m;
    ssl_session_tickets off;

    client_max_body_size 20m;

    location /static/ {
        alias /var/www/apps/portalverdadeceara/shared/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /var/www/apps/portalverdadeceara/shared/media/;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://127.0.0.1:8070;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
